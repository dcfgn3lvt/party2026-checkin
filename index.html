<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>PARTY 2026 Check-In</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: #f7f7f7;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      margin-bottom: 20px;
      color: #666;
    }

    #reader {
      max-width: 400px;
      margin: auto;
      background: white;
      padding: 10px;
      border-radius: 15px;
    }

    #result {
      margin: 20px auto;
      max-width: 400px;
      padding: 20px;
      border-radius: 15px;
      background: white;
      font-size: 20px;
      font-weight: bold;
      word-break: break-word;
    }

    .success {
      color: #16803c;
    }

    .warning {
      color: #b77900;
    }

    .error {
      color: #c62828;
    }
  </style>
</head>

<body>

  <h1>🎉 PARTY 2026</h1>

  <div class="subtitle">
    Guest Check-In
  </div>

  <div id="reader"></div>

  <div id="result">
    📷 Scan a Guest QR Code
  </div>


  <script>

    let processing = false;


    // ==========================================
    // SHOW RESULT
    // ==========================================

    function showResult(message, className) {

      const result =
        document.getElementById("result");

      result.className = className || "";

      result.innerHTML = message;

    }


    // ==========================================
    // QR SCANNED
    // ==========================================

    function onScanSuccess(decodedText) {

      if (processing) return;

      processing = true;


      // Clean scanned Guest ID
      const guestId =
        String(decodedText)
          .trim()
          .replace(/\s+/g, " ");


      // Show scanned ID for checking
      showResult(
        "⏳ Checking guest...<br><br>" +
        guestId,
        ""
      );


      // ==========================================
      // SEND TO APPS SCRIPT
      // ==========================================

      google.script.run

        .withSuccessHandler(function(response) {


          // ==============================
          // SUCCESS
          // ==============================

          if (response.success) {

            showResult(

              "✅ CHECK-IN SUCCESSFUL" +

              "<br><br>" +

              response.name +

              "<br><br>" +

              response.guestId,

              "success"

            );

          }


          // ==============================
          // ALREADY CHECKED IN
          // ==============================

          else if (response.alreadyCheckedIn) {

            showResult(

              "⚠️ ALREADY CHECKED IN" +

              "<br><br>" +

              response.name +

              "<br><br>" +

              response.guestId,

              "warning"

            );

          }


          // ==============================
          // NOT FOUND
          // ==============================

          else {

            showResult(

              "❌ GUEST NOT FOUND" +

              "<br><br>" +

              guestId,

              "error"

            );

          }


          // Ready for next guest

          setTimeout(function() {

            processing = false;

            showResult(
              "📷 Ready for next guest",
              ""
            );

          }, 3000);

        })


        // ==========================================
        // ERROR
        // ==========================================

        .withFailureHandler(function(error) {

          showResult(

            "❌ ERROR" +

            "<br><br>" +

            error.message,

            "error"

          );


          setTimeout(function() {

            processing = false;

            showResult(
              "📷 Ready for next guest",
              ""
            );

          }, 3000);

        })


        // ==========================================
        // CALL checkInGuest()
        // ==========================================

        .checkInGuest(guestId);

    }


    // ==========================================
    // START QR SCANNER
    // ==========================================

    const scanner =
      new Html5QrcodeScanner(

        "reader",

        {
          fps: 10,
          qrbox: 250
        }

      );


    scanner.render(onScanSuccess);

  </script>

</body>
</html>
